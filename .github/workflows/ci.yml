name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -v

      - name: Smoke-test generators (offline, cached sources)
        run: |
          # Deterministic small runs; parquet/jsonl land in each type's data/ dir.
          python text/generate.py --num 5 --seed 1 --format all --no-profile
          python agentic/generate.py --num 5 --seed 1 --format all --no-profile
          python pdf/generate.py --num 5 --seed 1 --format aiperf --no-profile --skip-fetch
          python image/generate.py --num 5 --seed 1 --format aiperf --no-profile --skip-fetch
